<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Sala</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'><rect width='8' height='8' fill='%231a1c2c'/><rect x='1' y='3' width='6' height='3' fill='%23ef7d57'/><rect x='1' y='2' width='6' height='1' fill='%23b13e53'/><rect x='0' y='3' width='1' height='3' fill='%23b13e53'/><rect x='7' y='3' width='1' height='3' fill='%23b13e53'/></svg>">
<link rel="preload" href="/fonts/pixelify-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Fuentes servidas por la propia sala (funciona sin internet dentro de la VPN). Licencia OFL en /fonts. */
@font-face { font-family: "Pixelify Sans"; src: url(/fonts/pixelify-sans-latin-400-normal.woff2) format("woff2"); font-weight: 400 500; font-display: swap; }
@font-face { font-family: "Pixelify Sans"; src: url(/fonts/pixelify-sans-latin-600-normal.woff2) format("woff2"); font-weight: 600 700; font-display: swap; }
@font-face { font-family: "Press Start 2P"; src: url(/fonts/press-start-2p-latin-400-normal.woff2) format("woff2"); font-weight: 400; font-display: swap; }
/* Paleta: Sweetie 16 */
:root {
  --c-ink: #1a1c2c; --c-plum: #5d275d; --c-red: #b13e53; --c-orange: #ef7d57; --c-yellow: #ffcd75;
  --c-lime: #a7f070; --c-green: #38b764; --c-teal: #257179; --c-navy: #29366f; --c-blue: #3b5dc9;
  --c-sky: #41a6f6; --c-cyan: #73eff7; --c-white: #f4f4f4; --c-silver: #94b0c2; --c-gray: #566c86; --c-slate: #333c57;

  --bg: #c9d6df;
  --bg-dot: #b7c7d2;
  --panel: var(--c-white);
  --panel-2: #e3e9ee;
  --ink: var(--c-ink);
  --muted: var(--c-gray);
  --line: var(--c-ink);
  --shadow: var(--c-ink);
  --title: var(--c-navy);
  --accent: var(--c-blue);
  --ok: var(--c-green);
  --wait: var(--c-yellow);
  --bad: var(--c-red);

  /* sala */
  --wall: #4b5a8a; --wall-2: #54649a; --base: var(--c-ink);
  --wood: #b86f50; --wood-2: #9c5a40; --wood-hi: #c98a65;
  --tile: #a9c3d1; --tile-2: #94b0c2;
  --rug: var(--c-teal); --rug-2: #1d5a61; --rug-edge: var(--c-yellow);
  --sofa: var(--c-red); --sofa-2: #8c2f42; --sofa-hi: #c95468;
  --arcade: var(--c-ink); --arcade-grid: #222744;

  --font-ui: "Pixelify Sans", "Courier New", ui-monospace, monospace;
  --font-logo: "Press Start 2P", "Pixelify Sans", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12131f; --bg-dot: #1c1e30;
    --panel: var(--c-slate); --panel-2: #2a3149;
    --ink: var(--c-white); --muted: var(--c-silver);
    --line: #0b0c14; --shadow: #0b0c14;
    --title: var(--c-plum); --accent: var(--c-sky);
    --wall: #2b3358; --wall-2: #303a63;
    --wood: #7d4a3a; --wood-2: #663b2f; --wood-hi: #8f5846;
    --tile: #4a5a76; --tile-2: #415069;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background-color: var(--bg);
  background-image: radial-gradient(var(--bg-dot) 1px, transparent 1.5px);
  background-size: 8px 8px;
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 16px;
  line-height: 1.35;
  /* Pixelify Sans dibuja la ligadura "fi" como si fuera una A */
  font-variant-ligatures: none;
  font-feature-settings: "liga" 0, "clig" 0, "calt" 0;
}
svg text { font-variant-ligatures: none; font-feature-settings: "liga" 0, "clig" 0, "calt" 0; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--c-orange); outline-offset: 2px; }
svg.px, .px { image-rendering: pixelated; shape-rendering: crispEdges; }

header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 18px 24px 8px; }
h1 {
  font-family: var(--font-logo); font-weight: 400; font-size: 26px; line-height: 1; margin: 0;
  color: var(--ink); text-shadow: 3px 3px 0 var(--c-orange);
}
.conn {
  display: flex; align-items: center; gap: 8px; font-size: 15px;
  background: var(--panel); border: 2px solid var(--line); padding: 3px 10px 3px 8px;
}
.conn i { width: 10px; height: 10px; background: var(--c-gray); display: inline-block; box-shadow: inset -2px -2px 0 rgba(0,0,0,.3); }
.conn.on i { background: var(--c-lime); }
.clock { margin-left: auto; font-family: var(--font-logo); font-size: 12px; color: var(--muted); }

main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 22px; padding: 10px 24px 28px; align-items: start; }
@media (max-width: 920px) {
  main { grid-template-columns: 1fr; padding: 8px 12px 24px; gap: 18px; }
  header { padding: 14px 12px 4px; }
  h1 { font-size: 20px; }
  .clock { display: none; }
}

/* ---------- sala ---------- */
#room {
  position: relative; width: 100%; aspect-ratio: 1000 / 620; container-type: inline-size;
  border: 4px solid var(--line); box-shadow: 6px 6px 0 var(--shadow);
  overflow: hidden; user-select: none; background: var(--c-ink);
}
#room.can-walk { cursor: crosshair; }
#room::after { /* líneas de CRT muy suaves */
  content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 1500;
  background: repeating-linear-gradient(to bottom, rgba(10, 10, 30, .07) 0 1px, transparent 1px 3px);
}
#room > svg.floor { position: absolute; inset: 0; width: 100%; height: 100%; }
.r-wall { fill: var(--wall); } .r-wall-2 { fill: var(--wall-2); } .r-base { fill: var(--base); }
.r-wood { fill: var(--wood); } .r-wood-2 { fill: var(--wood-2); } .r-wood-hi { fill: var(--wood-hi); }
.r-tile { fill: var(--tile); } .r-tile-2 { fill: var(--tile-2); }
.r-rug { fill: var(--rug); } .r-rug-2 { fill: var(--rug-2); } .r-rug-edge { fill: var(--rug-edge); }
.r-sofa { fill: var(--sofa); } .r-sofa-2 { fill: var(--sofa-2); } .r-sofa-hi { fill: var(--sofa-hi); }
.r-arcade { fill: var(--arcade); } .r-arcade-grid { fill: var(--arcade-grid); }
.r-ink { fill: var(--c-ink); }
.plaque-bg { fill: var(--c-ink); } .plaque-tx { fill: var(--c-white); font-family: var(--font-ui); font-size: 17px; font-weight: 600; }
.neon { font-family: var(--font-logo); font-size: 17px; fill: var(--c-cyan); }
.led { font-family: var(--font-logo); font-size: 14px; fill: var(--c-lime); }

.sky { fill: #41a6f6; transition: fill 2s; }
.cloud { fill: var(--c-white); }
.star, .moon { opacity: 0; }
#room[data-time="sunset"] .sky { fill: var(--c-orange); }
#room[data-time="sunset"] .cloud { fill: var(--c-yellow); }
#room[data-time="night"] .sky { fill: var(--c-navy); }
#room[data-time="night"] .cloud { opacity: 0; }
#room[data-time="night"] .star, #room[data-time="night"] .moon { opacity: 1; }
.sun { fill: var(--c-yellow); }
#room[data-time="night"] .sun { opacity: 0; }
.night-tint { fill: var(--c-navy); opacity: 0; transition: opacity 2s; pointer-events: none; }
#room[data-time="sunset"] .night-tint { opacity: .12; }
#room[data-time="night"] .night-tint { opacity: .28; }
.glow { fill: var(--c-yellow); opacity: 0; transition: opacity 2s; }
#room[data-time="night"] .glow, #room[data-time="sunset"] .glow { opacity: .22; }
.lamp-bulb { fill: var(--c-yellow); }
.blink { animation: blink 1.2s steps(2) infinite; }
.blink.b2 { animation-duration: .9s; }
@keyframes blink { 50% { opacity: .35; } }

.desk, .av { position: absolute; }
.desk { width: 14cqw; transform: translate(-50%, -57%); pointer-events: none; }
.desk svg { display: block; width: 100%; height: auto; overflow: visible; }
.desk .screen { fill: #2a3149; }
.desk.on .screen { fill: #1d6b73; }
.desk .code { opacity: 0; }
.desk.on .code { opacity: 1; animation: code 1.6s steps(4) infinite; transform-box: fill-box; transform-origin: left; }
.desk.on .code.c2 { animation-delay: -.5s; } .desk.on .code.c3 { animation-delay: -1s; }
@keyframes code { 0% { transform: scaleX(.25); } 100% { transform: scaleX(1); } }
.desk .plate { font-family: var(--font-ui); font-weight: 600; font-size: 13px; fill: var(--c-white); }

.av {
  transform: translate(-50%, -100%);
  display: flex; flex-direction: column; align-items: center;
  transition: left 1.2s linear, top 1.2s linear;
  pointer-events: none;
}
.av .sprite { width: 6.3cqw; min-width: 26px; }
.av .sprite.left { transform: scaleX(-1); }
.av .sprite svg { display: block; width: 100%; height: auto; }
.av.working .sprite svg, .av.waiting .sprite svg { animation: type .5s steps(2) infinite; }
.av.idle .sprite svg, .av.lobby .sprite svg, .av.playing .sprite svg { animation: idle 1.6s steps(2) infinite; }
.av.walking .sprite svg { animation: walk .32s steps(2) infinite; }
.av.afk { filter: grayscale(.7); opacity: .7; }
@keyframes type { 50% { transform: translateY(-3%); } }
@keyframes idle { 50% { transform: translateY(1.5%) scaleY(.985); } }
@keyframes walk { 50% { transform: translateY(-6%); } }

.tag {
  font-family: var(--font-ui); font-weight: 600; font-size: clamp(9px, 1.3cqw, 15px); line-height: 1.15;
  background: var(--c-ink); color: var(--c-white); padding: .1em .45em; white-space: nowrap;
  border: 2px solid var(--c-white); margin-bottom: 2px;
}
.tag small { color: var(--c-yellow); margin-left: .35em; font-weight: 500; }
.av.me .tag { background: var(--c-blue); }
.status {
  font-size: clamp(8px, 1.15cqw, 13px); white-space: nowrap; background: var(--c-white); color: var(--c-ink);
  border: 2px solid var(--c-ink); padding: 0 .4em; margin-bottom: 2px;
}
.status:empty, .av.playing .status { display: none; }
.av.waiting .status { background: var(--c-yellow); animation: blink 1s steps(2) infinite; }
.zz { position: absolute; top: 0; right: -1.2cqw; font-family: var(--font-logo); font-size: clamp(7px, 1cqw, 11px); color: var(--c-white); text-shadow: 1px 1px 0 var(--c-ink); display: none; animation: zz 2s steps(4) infinite; }
.av.afk .zz { display: block; }
@keyframes zz { 0% { transform: translate(0, 0); opacity: 0; } 25% { opacity: 1; } 100% { transform: translate(6px, -14px); opacity: 0; } }

.bubble {
  position: absolute; bottom: 100%; left: 50%; transform: translate(-50%, -8px);
  background: var(--c-white); color: var(--c-ink); border: 2px solid var(--c-ink); box-shadow: 3px 3px 0 var(--c-ink);
  padding: .25em .6em; font-size: clamp(10px, 1.4cqw, 16px); width: max-content; max-width: 28cqw;
  text-align: center; overflow-wrap: anywhere; animation: pop .18s steps(3);
}
.bubble::after {
  content: ""; position: absolute; top: 100%; left: calc(50% - 6px); width: 12px; height: 8px; background: var(--c-ink);
  clip-path: polygon(0 0, 100% 0, 100% 25%, 75% 25%, 75% 50%, 50% 50%, 50% 100%, 25% 100%, 25% 25%, 0 25%);
}
.bubble.emote { background: none; border: 0; box-shadow: none; font-size: clamp(18px, 3cqw, 34px); padding: 0; }
.bubble.emote::after { display: none; }
.burst { position: absolute; bottom: 100%; left: 50%; font-size: clamp(16px, 2.6cqw, 30px); animation: rise 1.6s steps(8) forwards; }
@keyframes pop { from { transform: translate(-50%, 0) scale(.6); opacity: 0; } }
@keyframes rise { to { transform: translate(-50%, -60px); opacity: 0; } }

.pet { position: absolute; bottom: 0; left: calc(50% + 2.9cqw); width: 3.9cqw; min-width: 16px; }
.pet .petsvg.right { transform: scaleX(-1); }
.pet svg { display: block; width: 100%; height: auto; }
.av.working .pet, .av.waiting .pet { bottom: 2.4cqw; left: calc(50% + 3.4cqw); }
.av.idle .pet svg, .av.lobby .pet svg, .av.playing .pet svg { animation: hop 1.8s steps(1) infinite; }
.av.walking .pet svg { animation: walk .32s steps(2) infinite reverse; }
.pet .mood { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); font-size: clamp(9px, 1.4cqw, 16px); line-height: 1; }
@keyframes hop { 0%, 80% { transform: translateY(0); } 85% { transform: translateY(-12%); } 92% { transform: translateY(-6%); } }

/* sala angosta (celular): el estado se lee en la lista del equipo, arriba de las cabezas solo el nombre */
@container (max-width: 560px) {
  .status { display: none; }
  .tag { font-size: 8px; border-width: 1px; padding: 0 .3em; }
  .tag small { display: none; }
  .bubble { font-size: 10px; max-width: 40cqw; border-width: 1px; box-shadow: 2px 2px 0 var(--c-ink); }
  .pet .mood { font-size: 9px; }
}
.room-hint { font-size: 15px; color: var(--muted); margin: 14px 2px 0; }

/* ---------- ventanas retro ---------- */
aside { display: grid; gap: 20px; }
.card { background: var(--panel); border: 3px solid var(--line); box-shadow: 5px 5px 0 var(--shadow); padding: 0 14px 14px; }
.card h2 {
  margin: 0 -14px 12px; padding: 9px 10px 8px 12px; background: var(--title); color: var(--c-white);
  font-family: var(--font-logo); font-weight: 400; font-size: 11px; line-height: 1.3;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  border-bottom: 3px solid var(--line);
}
.card h2::after {
  content: ""; flex: none; width: 34px; height: 10px;
  background: linear-gradient(90deg, var(--c-yellow) 0 10px, transparent 10px 12px, var(--c-lime) 12px 22px, transparent 22px 24px, var(--c-red) 24px 34px);
}
.team { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.team li { display: grid; grid-template-columns: 12px 1fr auto; align-items: center; gap: 10px; }
.team .dot { width: 12px; height: 12px; background: var(--c-gray); box-shadow: inset -2px -2px 0 rgba(0,0,0,.3); }
.team .who { font-weight: 600; font-size: 17px; line-height: 1.15; }
.team .what { display: block; font-size: 14px; color: var(--muted); font-weight: 400; }
.team .lvl { font-size: 13px; color: var(--ink); background: var(--panel-2); border: 2px solid var(--line); padding: 0 6px; }
.dot.working { background: var(--c-sky); } .dot.waiting { background: var(--c-yellow); animation: blink 1s steps(2) infinite; }
.dot.idle, .dot.lobby { background: var(--c-green); } .dot.afk { background: var(--c-gray); }
.team li.rival { grid-template-columns: 1fr auto; }

.btn {
  border: 2px solid var(--line); background: var(--accent); color: var(--c-white); font-weight: 600;
  padding: 6px 12px; cursor: pointer; border-radius: 0;
  box-shadow: inset -3px -3px 0 rgba(0, 0, 0, .3), inset 3px 3px 0 rgba(255, 255, 255, .25);
}
.btn:active:not(:disabled) { box-shadow: inset 3px 3px 0 rgba(0, 0, 0, .3); transform: translate(1px, 1px); }
.btn.soft { background: var(--panel-2); color: var(--ink); }
.btn:disabled { background: var(--panel-2); color: var(--muted); cursor: not-allowed; box-shadow: none; }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.opt {
  border: 2px solid var(--line); background: var(--panel); padding: 3px 9px; font-size: 15px; cursor: pointer;
  box-shadow: inset -2px -2px 0 rgba(0, 0, 0, .15);
}
.opt[aria-pressed="true"] { background: var(--accent); color: var(--c-white); box-shadow: inset 2px 2px 0 rgba(0, 0, 0, .3); }
.sw { width: 26px; height: 26px; border: 2px solid var(--line); cursor: pointer; padding: 0; box-shadow: inset -3px -3px 0 rgba(0, 0, 0, .2); }
.sw[aria-pressed="true"] { outline: 3px solid var(--c-orange); outline-offset: 1px; }
.group-label { font-size: 14px; color: var(--muted); margin-bottom: 4px; }
.editor { display: grid; gap: 12px; }
.preview {
  display: flex; justify-content: center; align-items: flex-end; height: 132px;
  background: var(--panel-2); border: 2px solid var(--line);
  background-image: linear-gradient(var(--wood) 0 0); background-size: 100% 22px; background-repeat: no-repeat; background-position: bottom;
}
.preview svg { width: 74px; height: auto; display: block; margin-bottom: 8px; }
.note { font-size: 15px; color: var(--muted); margin: 0; }
.chat { display: flex; gap: 6px; }
.chat input, .pet-name {
  flex: 1; min-width: 0; border: 2px solid var(--line); background: var(--panel-2); padding: 6px 9px; border-radius: 0;
  box-shadow: inset 2px 2px 0 rgba(0, 0, 0, .15);
}
.emotes { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.emotes button { border: 2px solid var(--line); background: var(--panel-2); font-size: 18px; padding: 1px 6px; cursor: pointer; }
.toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.toggle input { width: 18px; height: 18px; accent-color: var(--accent); }

.pet-head { display: grid; grid-template-columns: 84px 1fr; gap: 12px; align-items: center; margin-bottom: 10px; }
.pet-preview { background: var(--panel-2); border: 2px solid var(--line); padding: 10px 8px; display: flex; align-items: flex-end; justify-content: center; height: 76px; }
.pet-preview svg { width: 100%; height: auto; display: block; }
.pet-name { width: 100%; font-weight: 600; }
.coins { margin-top: 8px; display: flex; align-items: center; gap: 6px; font-size: 15px; }
.coins b { font-family: var(--font-logo); font-size: 14px; font-weight: 400; }
.coin { width: 16px; height: 16px; flex: none; }
.meter-row { display: grid; grid-template-columns: 54px 1fr 30px; align-items: center; gap: 8px; font-size: 14px; margin: 6px 0; }
.meter { height: 16px; border: 2px solid var(--line); background: var(--panel-2); padding: 2px; }
.meter i { display: block; height: 100%; background: repeating-linear-gradient(90deg, var(--c-green) 0 8px, transparent 8px 10px); transition: width .6s steps(6); }
.meter i.low { background: repeating-linear-gradient(90deg, var(--c-yellow) 0 8px, transparent 8px 10px); }
.meter i.crit { background: repeating-linear-gradient(90deg, var(--c-red) 0 8px, transparent 8px 10px); }
.shop { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin: 12px 0 10px; }
.shop button {
  display: flex; align-items: center; gap: 8px; text-align: left; border: 2px solid var(--line); background: var(--panel);
  padding: 5px 8px; cursor: pointer; font-size: 15px; box-shadow: inset -2px -2px 0 rgba(0, 0, 0, .15);
}
.shop button:active:not(:disabled) { transform: translate(1px, 1px); }
.shop button:disabled { opacity: .45; cursor: not-allowed; }
.shop .em { font-size: 20px; }
.shop small { display: flex; align-items: center; gap: 3px; color: var(--muted); font-size: 13px; }
.shop small svg { width: 11px; height: 11px; }
.stack { display: grid; gap: 10px; }

/* ---------- personaje con IA ---------- */
.ai-banner { border: 2px dashed var(--accent); background: var(--panel-2); padding: 8px 10px; display: grid; gap: 8px; }
.ai-banner p { margin: 0; font-size: 15px; }
.opts.locked { opacity: .4; }
.opts.locked button { cursor: not-allowed; }
code { font-family: var(--font-ui); background: var(--panel-2); border: 1px solid var(--line); padding: 0 4px; }

/* ---------- sonido ---------- */
.snd {
  display: flex; align-items: center; gap: 6px; background: var(--panel); color: var(--ink);
  border: 2px solid var(--line); padding: 3px 9px; cursor: pointer; font-size: 15px;
}
.snd svg { width: 18px; height: 14px; display: block; }
.snd[aria-pressed="true"] { background: var(--c-lime); color: var(--c-ink); }

/* ---------- animaciones de la mascota ---------- */
.pet-preview { position: relative; }
.av .pet.eat .petsvg svg, .pet-preview.eat > svg { animation: chomp .28s steps(2) 5; }
.av .pet.play .petsvg svg, .pet-preview.play > svg { animation: jump .5s steps(4) 3; }
.av .pet.love .petsvg svg, .pet-preview.love > svg { animation: wiggle .3s steps(2) 4; }
@keyframes chomp { 50% { transform: scaleY(.82) translateY(9%); } }
@keyframes jump { 50% { transform: translateY(-45%); } }
@keyframes wiggle { 50% { transform: rotate(-9deg); } }
.petfx { position: absolute; pointer-events: none; font-size: clamp(10px, 1.7cqw, 18px); line-height: 1; }
.pet-preview .petfx { font-size: 22px; }
.petfx.eat { left: -45%; bottom: 35%; animation: feed 1.4s steps(7) forwards; }
.petfx.play { right: -55%; bottom: 0; animation: bounce .5s steps(4) 3; }
.petfx.love { left: 0; bottom: 100%; display: flex; gap: 2px; animation: hearts 1.6s steps(8) forwards; }
.petfx.love svg { width: clamp(5px, .9cqw, 10px); height: auto; }
.pet-preview .petfx.love svg { width: 13px; }
@keyframes feed { 0% { transform: translate(-70%, -130%); } 55% { transform: translate(0, 0); } 100% { transform: translate(40%, 20%) scale(.2); opacity: 0; } }
@keyframes bounce { 50% { transform: translateY(-140%); } }
@keyframes hearts { to { transform: translateY(-140%); opacity: 0; } }

/* ---------- avisos ---------- */
#toasts { position: fixed; right: 16px; bottom: 16px; display: grid; gap: 10px; z-index: 50; }
.toast {
  background: var(--c-ink); color: var(--c-white); border: 3px solid var(--c-white); box-shadow: 4px 4px 0 var(--c-ink);
  padding: 9px 13px; font-size: 16px; animation: pop2 .2s steps(3); max-width: 320px;
}
@keyframes pop2 { from { transform: translateY(10px); opacity: 0; } }
#invites { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: grid; gap: 10px; z-index: 60; width: min(92vw, 380px); }
.invite { background: var(--panel); border: 3px solid var(--line); box-shadow: 5px 5px 0 var(--shadow); animation: pop2 .2s steps(3); }
.invite h3 { margin: 0; background: var(--c-red); color: var(--c-white); font-family: var(--font-logo); font-weight: 400; font-size: 11px; padding: 8px 10px; border-bottom: 3px solid var(--line); }
.invite p { margin: 10px 12px; font-size: 17px; font-weight: 600; }
.invite .countdown { color: var(--muted); font-weight: 400; }
.invite .row { display: flex; gap: 8px; padding: 0 12px 12px; }

/* ---------- juegos: pantalla arcade ---------- */
dialog#gameDlg {
  border: 4px solid var(--c-ink); padding: 0; background: var(--c-ink); color: var(--c-white);
  width: min(94vw, 470px); box-shadow: 0 0 0 4px var(--c-cyan), 8px 8px 0 4px var(--c-ink);
}
dialog#gameDlg::backdrop { background: rgba(10, 11, 22, .72); }
#gameBox {
  position: relative; padding: 18px; display: grid; gap: 12px;
  background: repeating-linear-gradient(to bottom, rgba(255, 255, 255, .03) 0 1px, transparent 1px 3px), var(--c-ink);
}
#gameBox h2 { font-family: var(--font-logo); font-weight: 400; margin: 0; font-size: 15px; color: var(--c-cyan); text-shadow: 2px 2px 0 var(--c-plum); }
.vs { display: flex; justify-content: space-between; gap: 10px; font-size: 16px; font-weight: 600; }
.vs span { display: flex; align-items: center; gap: 6px; }
.vs svg { width: 16px; height: 16px; }
.gstatus { font-family: var(--font-logo); font-size: 12px; text-align: center; min-height: 1.5em; color: var(--c-yellow); line-height: 1.5; }
.ttt { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; aspect-ratio: 1; }
.ttt button {
  border: 3px solid var(--c-gray); background: var(--c-slate); cursor: pointer; padding: 18%;
  box-shadow: inset -4px -4px 0 rgba(0, 0, 0, .3);
}
.ttt button svg { width: 100%; height: 100%; display: block; }
.ttt button:not(:disabled):hover { border-color: var(--c-cyan); }
.ttt button:disabled { cursor: default; }
.ttt button.win { background: var(--c-teal); border-color: var(--c-lime); animation: blink .8s steps(2) infinite; }
.c4 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; background: var(--c-blue); padding: 8px; border: 3px solid var(--c-navy); box-shadow: inset -4px -4px 0 rgba(0, 0, 0, .3); }
.c4 button {
  aspect-ratio: 1; border: 0; background: var(--c-ink); cursor: pointer; padding: 0;
  clip-path: polygon(30% 0, 70% 0, 70% 10%, 90% 10%, 90% 30%, 100% 30%, 100% 70%, 90% 70%, 90% 90%, 70% 90%, 70% 100%, 30% 100%, 30% 90%, 10% 90%, 10% 70%, 0 70%, 0 30%, 10% 30%, 10% 10%, 30% 10%);
}
.c4 button:disabled { cursor: default; }
.c4 button.d0 { background: var(--c-red); box-shadow: inset -5px -5px 0 rgba(0, 0, 0, .3), inset 4px 4px 0 rgba(255, 255, 255, .25); }
.c4 button.d1 { background: var(--c-yellow); box-shadow: inset -5px -5px 0 rgba(0, 0, 0, .25), inset 4px 4px 0 rgba(255, 255, 255, .4); }
.c4 button.last { filter: brightness(1.2); }
.c4 button.win { animation: blink .8s steps(2) infinite; }
.pad {
  height: 210px; border: 4px solid var(--c-white); font-family: var(--font-logo); font-size: 22px; line-height: 1.4;
  color: var(--c-white); background: var(--c-slate); cursor: pointer; touch-action: manipulation; user-select: none;
  box-shadow: inset -8px -8px 0 rgba(0, 0, 0, .3), inset 8px 8px 0 rgba(255, 255, 255, .12);
}
.pad.wait { background: var(--c-red); } .pad.go { background: var(--c-green); } .pad.result { background: var(--c-blue); }
.pad small { display: block; font-family: var(--font-ui); font-size: 16px; margin-top: 10px; }
.score { text-align: center; font-family: var(--font-logo); font-size: 24px; color: var(--c-white); }
.gfoot { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
#gameBox .btn.soft { background: var(--c-slate); color: var(--c-white); border-color: var(--c-gray); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
/* ================= v0.5: layout para media pantalla, pestañas, avisos ================= */
main.app { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 18px; padding: 8px 18px 22px; align-items: start; }
@media (max-width: 1099px) { main.app { grid-template-columns: 1fr; padding: 6px 12px 22px; } }
body.wide-room .dock { display: none; }
body.wide-room main.app { grid-template-columns: 1fr; }
body.wide-room .stage { max-width: calc((100vh - 150px) * 1000 / 620); width: 100%; margin: 0 auto; }
header { padding: 12px 18px 6px; gap: 10px; }
h1 { font-size: 22px; }
.hbtn {
  display: flex; align-items: center; gap: 6px; background: var(--panel); color: var(--ink);
  border: 2px solid var(--line); padding: 3px 9px; cursor: pointer; font-size: 15px;
}
.hbtn svg { width: 16px; height: 14px; display: block; }
.hbtn[aria-pressed="true"] { background: var(--c-lime); color: var(--c-ink); }
@media (max-width: 640px) { .hbtn span { display: none; } .conn span { max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } }

/* tira personal: lo ve solo el dueño */
.mine {
  display: flex; align-items: center; gap: 10px; margin-bottom: 10px; padding: 8px 12px;
  background: var(--panel); border: 3px solid var(--line); box-shadow: 4px 4px 0 var(--shadow); font-size: 16px;
}
.mine svg { height: 20px; width: auto; flex: none; }
.mine b { font-weight: 600; }
.mine .sub { color: var(--muted); margin-left: auto; white-space: nowrap; font-size: 15px; }
.mine.waiting { background: var(--c-yellow); color: var(--c-ink); animation: blink 1s steps(2) infinite; }
.mine.waiting .sub { color: var(--c-ink); }
.mine.done { background: var(--c-lime); color: var(--c-ink); }
.mine.done .sub { color: var(--c-ink); }
.mine.idle { opacity: .85; }

/* pestañas */
.dock { padding: 0; }
.tabs { display: flex; border-bottom: 3px solid var(--line); background: var(--title); }
.tabs button {
  flex: 1; position: relative; border: 0; border-right: 3px solid var(--line); background: transparent; color: #cdd6f4;
  font-weight: 600; font-size: 16px; padding: 9px 4px; cursor: pointer;
}
.tabs button:last-child { border-right: 0; }
.tabs button[aria-selected="true"] { background: var(--panel); color: var(--ink); }
.tabs .badge { position: absolute; top: 5px; right: 6px; width: 9px; height: 9px; background: var(--c-orange); box-shadow: 0 0 0 2px var(--line); }
.tabpanel { padding: 14px; }
.tabpanel h3 { font-size: 15px; font-weight: 600; color: var(--muted); margin: 14px 0 6px; }
.tabpanel h3:first-child { margin-top: 0; }

/* lista del equipo */
.team li { grid-template-columns: 20px 1fr; }
.team .ico svg { width: 18px; height: auto; display: block; }
.team li.off { opacity: .45; }
.team li.rival { grid-template-columns: 1fr auto; }
.unavail { font-size: 14px; color: var(--muted); margin: 8px 0 0; }

/* charla */
.log { list-style: none; margin: 0 0 8px; padding: 6px 8px; max-height: 200px; overflow-y: auto; background: var(--panel-2); border: 2px solid var(--line); display: grid; gap: 3px; font-size: 15px; }
.log:empty::before { content: "Todavía nadie dijo nada."; color: var(--muted); }
.log b { font-weight: 600; }
.log time { color: var(--muted); font-size: 13px; margin-right: 4px; }
.welcome { background: var(--panel-2); border: 2px dashed var(--accent); padding: 10px 12px; margin-bottom: 14px; display: grid; gap: 8px; }
.welcome p { margin: 0; }

/* sala */
.av .sprite { width: 6.8cqw; min-width: 26px; }
.robot { position: absolute; width: 6.2cqw; min-width: 22px; transform: translate(-50%, -100%); pointer-events: none; }
.robot svg { display: block; width: 100%; height: auto; animation: type .45s steps(2) infinite; }
.robot .alert { position: absolute; left: 50%; bottom: 100%; width: 1.1cqw; min-width: 5px; transform: translate(-50%, -4px); display: none; animation: blink .8s steps(2) infinite; }
.robot.needs .alert { display: block; }
.robot .alert svg { animation: none; }
.marker { position: absolute; width: 1.8cqw; transform: translate(-50%, -50%); pointer-events: none; z-index: 1400; animation: mk .6s steps(4) forwards; }
@keyframes mk { to { opacity: 0; transform: translate(-50%, -50%) scale(.4); } }
.burst svg { width: clamp(14px, 2.4cqw, 28px); height: auto; display: block; }
.pet .mood svg { width: clamp(8px, 1.3cqw, 15px); height: auto; display: block; }
.petfx svg { width: clamp(9px, 1.6cqw, 18px); height: auto; display: block; }
.pet-preview .petfx svg { width: 20px; }
.desk.small { width: 11.5cqw; }

/* tienda con íconos pixel */
.shop .em svg { width: 22px; height: auto; display: block; }
.game-alert { background: var(--c-yellow); color: var(--c-ink); border: 2px solid var(--c-white); padding: 6px 10px; font-weight: 600; text-align: center; animation: blink 1s steps(2) infinite; }

/* Todo entra en la ventana (pensado para media pantalla al lado de la terminal):
   la sala se ajusta a la altura disponible y solo scrollea el contenido de las pestañas. */
html, body { height: 100%; }
body { display: flex; flex-direction: column; }
main.app { flex: 1; min-height: 0; }
.stage { width: 100%; max-width: calc((100vh - 150px) * 1000 / 620); margin: 0 auto; }
.dock { display: flex; flex-direction: column; min-height: 0; max-height: calc(100vh - 86px); position: sticky; top: 8px; }
.tabpanel { overflow-y: auto; min-height: 0; flex: 1; }
.room-hint { margin-top: 8px; font-size: 14px; }
@media (max-width: 1099px) {
  main.app { grid-template-rows: auto minmax(0, 1fr); }
  .stage { max-width: max(320px, calc((100vh - 400px) * 1000 / 620)); }
  .dock { max-height: none; position: static; height: 100%; min-height: 250px; }
}
@media (max-width: 1099px) and (max-height: 900px) { .room-hint { display: none; } }
@media (max-width: 640px), (max-height: 560px) {
  html, body { height: auto; }
  body { display: block; }
  .stage { max-width: none; }
  .dock { height: auto; }
  .tabpanel { overflow: visible; }
}

/* cuadros de animación: todos apilados, el CSS decide cuál se ve */
.frames, .petsvg, .pet-preview { display: grid; }
.frames > svg, .petsvg > svg, .pet-preview > svg { grid-area: 1 / 1; width: 100%; height: auto; display: block; }
.frames > .f-b, .frames > .f-w1, .frames > .f-w2, .petsvg > .f-w, .pet-preview > .f-w { visibility: hidden; }
.av .frames > .f-b, .preview .frames > .f-b { animation: fblink 4.6s steps(1) infinite; animation-delay: var(--blink, 0s); }
@keyframes fblink { 0%, 96% { visibility: hidden; } 97%, 100% { visibility: visible; } }
.av.walking .frames > .f-q, .av.walking .frames > .f-b { visibility: hidden; animation: none; }
.av.walking .frames > .f-w1, .av.walking .petsvg > .f-q { animation: fwa .36s steps(1) infinite; }
.av.walking .frames > .f-w2, .av.walking .petsvg > .f-w { animation: fwb .36s steps(1) infinite; }
@keyframes fwa { 0%, 49% { visibility: visible; } 50%, 100% { visibility: hidden; } }
@keyframes fwb { 0%, 49% { visibility: hidden; } 50%, 100% { visibility: visible; } }
.preview .frames { width: 74px; margin-bottom: 8px; }
.pet { width: 5.4cqw; min-width: 20px; left: calc(50% + 2.9cqw); }
.pet-preview { padding: 10px 6px; }

/* títulos más legibles */
.card h2 { font-family: var(--font-ui); font-weight: 600; font-size: 18px; }

.av.here .sprite svg { animation: idle 1.6s steps(2) infinite; }
.av.here .pet svg { animation: hop 1.8s steps(1) infinite; }
/* al caminar: alternar los cuadros de paso Y rebotar; si solo rebota, los cuadros de paso quedan ocultos y el muñeco desaparece */
.av.here.walking .frames > .f-w1 { animation: fwa .36s steps(1) infinite, walk .32s steps(2) infinite; }
.av.here.walking .frames > .f-w2 { animation: fwb .36s steps(1) infinite, walk .32s steps(2) infinite; }
.av.here.walking .petsvg > .f-q { animation: fwa .36s steps(1) infinite, walk .32s steps(2) infinite reverse; }
.av.here.walking .petsvg > .f-w { animation: fwb .36s steps(1) infinite, walk .32s steps(2) infinite reverse; }
.robot .burst { bottom: 100%; }
</style>

const Sound = (() => {
  let ctx = null, on = false;
  try { on = localStorage.getItem('sala_sound') === '1'; } catch { /* sin storage */ }
  function audio() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tone(freq, dur, { type = 'square', vol = 0.05, at = 0, slide = 0 } = {}) {
    const c = audio(), t = c.currentTime + at;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.linearRampToValueAtTime(freq + slide, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(c.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, { vol = 0.06, at = 0 } = {}) {
    const c = audio(), t = c.currentTime + at;
    const buf = c.createBuffer(1, Math.floor(c.sampleRate * dur), c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    const src = c.createBufferSource(), g = c.createGain();
    src.buffer = buf; g.gain.value = vol;
    src.connect(g).connect(c.destination);
    src.start(t);
  }
  const seq = (notes, step, opts) => notes.forEach((f, i) => tone(f, step * 1.3, { ...opts, at: i * step }));
  const SFX = {
    blip: () => tone(660, 0.06),
    chat: () => { tone(880, 0.05); tone(1320, 0.06, { at: 0.06 }); },
    done: () => seq([523, 659, 784, 1047], 0.09),
    alert: () => { tone(880, 0.12, { vol: 0.07 }); tone(660, 0.12, { at: 0.16, vol: 0.07 }); tone(880, 0.16, { at: 0.32, vol: 0.07 }); },
    invite: () => { for (let i = 0; i < 2; i++) { tone(988, 0.08, { at: i * 0.2 }); tone(1319, 0.08, { at: i * 0.2 + 0.09 }); } },
    start: () => seq([392, 523, 659], 0.07),
    go: () => tone(1200, 0.16, { vol: 0.07 }),
    win: () => seq([523, 659, 784, 659, 784, 1047], 0.1),
    lose: () => seq([392, 349, 311, 262], 0.14, { type: 'triangle', vol: 0.07 }),
    draw: () => seq([523, 523, 440], 0.12, { type: 'triangle' }),
    eat: () => { noise(0.05, { at: 0 }); noise(0.05, { at: 0.13 }); noise(0.05, { at: 0.26 }); },
    ball: () => { tone(260, 0.1, { slide: 260, type: 'triangle', vol: 0.08 }); tone(320, 0.1, { at: 0.5, slide: 260, type: 'triangle', vol: 0.08 }); },
    love: () => { tone(784, 0.1, { type: 'triangle', vol: 0.07 }); tone(1047, 0.18, { at: 0.1, type: 'triangle', vol: 0.07 }); },
    magic: () => seq([784, 988, 1175, 1568, 1976], 0.05, { type: 'triangle', vol: 0.05 }),
    error: () => tone(160, 0.16, { type: 'sawtooth', vol: 0.04 }),
  };
  return {
    get on() { return on; },
    play(name) { if (on && SFX[name]) { try { SFX[name](); } catch { /* audio bloqueado */ } } },
    toggle() {
      on = !on;
      try { localStorage.setItem('sala_sound', on ? '1' : '0'); } catch { /* sin storage */ }
      if (on) { try { audio(); SFX.blip(); } catch { /* sin audio */ } }
    },
  };
})();

// Solo aparecen en la sala los que la tienen abierta. Si tu Claude trabaja, un robotito se sienta en tu escritorio.
function placeOf(u) {
  if (u.playing) {
    const gi = (room.games || []).findIndex((g) => g.players.includes(u.name));
    if (gi >= 0) {
      const j = room.games[gi].players.indexOf(u.name);
      return { x: 690 + (gi % 2) * 175 + j * 92, y: 606 - Math.floor(gi / 2) * 22 };
    }
  }
  return u.pos || { x: 780, y: 300 };
}

// Separa a los que comparten lugar. Orden por nombre: todos los navegadores calculan lo mismo.
function layoutPlaces(list) {
  const places = new Map(list.map((u) => [u.name, { ...placeOf(u) }]));
  const free = list.filter((u) => !u.playing).sort((a, b) => a.name.localeCompare(b.name));
  const placed = [];
  const clash = (x, y) => placed.some((q) => Math.abs(q.x - x) < 76 && Math.abs(q.y - y) < 110);
  for (const u of free) {
    const p = places.get(u.name);
    const steps = [0, 84, -84, 168, -168, 252, -252, 336, -336];
    const tries = [...steps.map((dx) => [dx, 0]), ...steps.map((dx) => [dx, 115]), ...steps.map((dx) => [dx, -115])];
    for (const [dx, dy] of tries) {
      const x = Math.max(40, Math.min(p.x > 560 ? 920 : 500, p.x + dx));
      const y = Math.max(165, Math.min(x > 560 ? 395 : 600, p.y + dy));
      if (!clash(x, y)) { p.x = x; p.y = y; break; }
    }
    placed.push(p);
  }
  return places;
}

function hashName(n) { let h = 0; for (const c of n) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; }
function petMoodIcon(u) {
  if (!u.pet) return '';
  if (u.pet.mood === 'hambre') return ICON.meat;
  if (u.pet.mood === 'triste') return ICON.drop;
  const slot = Math.floor(Date.now() / 15000) + hashName(u.name);
  if (u.claude === 'working') return ICON[PET_BUSY[slot % PET_BUSY.length]];
  if (u.pet.mood === 'feliz' && slot % 3 === 0) return ICON.heart;
  return '';
}

function renderAvatars() {
  const shown = room.users.filter((u) => u.web || u.mini || u.playing);
  const places = layoutPlaces(shown);
  const seen = new Set();
  for (const u of shown) {
    seen.add(u.name);
    let sp = sprites.get(u.name);
    if (!sp) {
      const el = document.createElement('div');
      el.className = 'av';
      el.innerHTML = '<div class="tag"></div><div class="sprite"></div><div class="pet"><span class="mood"></span><div class="petsvg"></div></div>';
      layer.appendChild(el);
      sp = { el, key: '', petKey: '', x: null, y: null, walkTimer: null };
      sprites.set(u.name, sp);
    }
    const key = JSON.stringify([u.avatar, u.custom]);
    if (sp.key !== key) {
      sp.el.querySelector('.sprite').innerHTML = spriteSheet(u);
      sp.el.style.setProperty('--blink', `-${(hashName(u.name) % 40) / 10}s`); // cada uno parpadea a su ritmo
      sp.key = key;
    }
    if (u.pet && sp.petKey !== u.pet.kind) { sp.el.querySelector('.petsvg').innerHTML = petSheet(u.pet.kind); sp.petKey = u.pet.kind; }
    sp.el.querySelector('.mood').innerHTML = petMoodIcon(u);
    sp.el.querySelector('.tag').textContent = u.name;

    const p = places.get(u.name);
    let walking = false;
    if (sp.x !== null && (Math.abs(p.x - sp.x) > 4 || Math.abs(p.y - sp.y) > 4)) {
      const left = p.x < sp.x;
      sp.el.querySelector('.sprite').classList.toggle('left', left);
      sp.el.querySelector('.petsvg').classList.toggle('right', !left);
      walking = true;
      clearTimeout(sp.walkTimer);
      sp.walkTimer = setTimeout(() => sp.el.classList.remove('walking'), 1200);
    }
    sp.x = p.x; sp.y = p.y;
    sp.el.className = `av here${u.playing ? ' playing' : ''}${u.name === me ? ' me' : ''}${walking || sp.el.classList.contains('walking') ? ' walking' : ''}`;
    sp.el.style.left = p.x / 10 + 'cqw';
    sp.el.style.top = p.y / 10 + 'cqw';
    sp.el.style.zIndex = Math.round(p.y);
  }
  for (const [name, sp] of sprites) if (!seen.has(name)) { sp.el.remove(); sprites.delete(name); }
}

let doneUntil = 0;
let clockOffset = 0; // reloj del servidor menos el de esta PC
const elapsed = (since) => {
  if (!since) return '';
  const s = Math.max(0, Math.floor((Date.now() + clockOffset - since) / 1000));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
};
function renderMine() {
  const el = $('#mine');
  const c = meInfo && meInfo.claude;
  const showDone = Date.now() < doneUntil && c && c.state !== 'working' && c.state !== 'waiting';
  if (me && meHidden && !(c && c.state === 'waiting') && !showDone) {
    el.hidden = false;
    el.className = 'mine idle';
    el.innerHTML = `${ICON.moon}<b>Estás en modo invisible</b><span class="sub">nadie te ve en la sala · se desactiva en Personaje</span>`;
    return;
  }
  if (!me || !c || (c.state === 'off' && !showDone)) { el.hidden = true; return; }
  el.hidden = false;
  let cls, title, sub, ico = ICON.robot;
  if (showDone) { cls = 'done'; title = 'Tu Claude terminó'; sub = 'volvé a la terminal cuando quieras'; ico = ICON.star; }
  else if (c.state === 'waiting') { cls = 'waiting'; title = 'Tu Claude te necesita'; sub = 'te espera en la terminal'; ico = ICON.alert; }
  else if (c.state === 'working') { cls = 'working'; title = 'Tu Claude está trabajando'; sub = [c.activity, elapsed(c.since)].filter(Boolean).join(' · '); }
  else { cls = 'idle'; title = 'Tu Claude está libre'; sub = 'pedile algo y pasá el rato acá'; }
  el.className = 'mine ' + cls;
  el.innerHTML = `${ico}<b>${esc(title)}</b><span class="sub">${esc(sub)}</span>`;
}

    const b = e.target.closest('button[data-a]');
    if (!b) return;
    send({ type: 'invite_reply', id: m.id, accept: b.dataset.a === '1' });
    removeInvite(m.id);
  });
  $('#invites').appendChild(el);
  inviteEls.set(m.id, el);
  el.querySelector('button').focus();
}
function removeInvite(id) { const el = inviteEls.get(id); if (el) { clearInterval(el.timer); el.remove(); inviteEls.delete(id); } }

let game = null;
let goSeen = { round: -1, at: 0 };
const dlg = $('#gameDlg');
dlg.addEventListener('cancel', (e) => { if (game && game.status === 'playing') e.preventDefault(); });

function onGame(g) {
  if (g.type === 'reflejos' && g.phase === 'go' && goSeen.round !== g.round) goSeen = { round: g.round, at: performance.now() };
  const prev = game && game.id === g.id ? game : null;
  if (!prev) Sound.play('start');
  else if (g.status === 'over' && prev.status !== 'over') Sound.play(!g.winner ? 'draw' : g.winner === me ? 'win' : 'lose');
  else if (g.type === 'reflejos' && g.phase === 'go' && (prev.phase !== 'go' || prev.round !== g.round)) Sound.play('go');
  else if (g.board && JSON.stringify(g.board) !== JSON.stringify(prev.board)) Sound.play('blip');
  game = g;
  renderGame();
  if (!dlg.open) dlg.showModal();
}
function onGameOver(m) {
  if (m.winner) burst(m.winner, 'trophy');
  if (m.players.includes(me)) return;
  const label = GAME_LABEL[m.gameType] || m.gameType;
  if (m.reason === 'abandono') toast(`${m.winner} ganó en ${label}: el rival abandonó`);
  else if (m.winner) toast(`${m.winner} le ganó a ${m.players.find((p) => p !== m.winner)} en ${label}`);
  else toast(`${m.players[0]} y ${m.players[1]} empataron en ${label}`);
}
function gameStatusText(g) {
  const meIdx = g.players.indexOf(me);
  const rival = g.players[1 - meIdx];
  if (g.status === 'over') {
    if (g.reason === 'abandono') return g.quitter === me ? 'Abandonaste la partida' : `${rival} abandonó. ¡Ganaste! +10`;
    if (!g.winner) return 'Empate. +3';
    return g.winner === me ? '¡Ganaste! +10' : `Ganó ${rival}. +3`;
  }
  if (g.type === 'reflejos') return `Ronda ${Math.max(1, g.round)} · primero a 2`;
  return g.turn === meIdx ? 'Te toca' : `Le toca a ${rival}`;
}
function reflejosPad(g) {
  const meIdx = g.players.indexOf(me);
  if (g.status === 'over') return { cls: 'result', big: g.winner === me ? '¡Ganaste!' : 'Perdiste', small: `${g.score[meIdx]} a ${g.score[1 - meIdx]}` };
  if (g.phase === 'idle') return { cls: '', big: 'Listos', small: 'Cuando se ponga verde, tocá lo más rápido que puedas' };
  if (g.phase === 'wait') return g.hits[meIdx] ? { cls: 'wait', big: 'Te adelantaste', small: '' } : { cls: 'wait', big: 'Esperá…', small: 'Si tocás antes del verde, perdés la ronda' };
  if (g.phase === 'go') return g.hits[meIdx] ? { cls: 'go', big: `${g.hits[meIdx].ms} ms`, small: 'Esperando al rival…' } : { cls: 'go', big: '¡YA!', small: 'Tocá o apretá espacio' };
  const r = g.lastRound;
  if (!r) return { cls: 'result', big: '', small: '' };
  const fmt = (h) => (!h ? 'no tocó' : h.early ? 'se adelantó' : `${h.ms} ms`);
  const big = r.winner === null ? 'Empate' : r.winner === me ? 'Ronda tuya' : 'Ronda rival';
  return { cls: 'result', big, small: `Vos: ${fmt(r.hits[meIdx])} · Rival: ${fmt(r.hits[1 - meIdx])}` };
}
function renderGame() {
  const g = game;
  if (!g) return;
  const meIdx = g.players.indexOf(me);
  const myTurn = g.status === 'playing' && g.turn === meIdx;
  const tttMark = (i) => (i === 0 ? MARK_X : MARK_O);
  const chipFor = (i) => (g.type === 'cuatro'
    ? `<svg viewBox="0 0 4 4" class="px"><rect x="1" width="2" height="4" fill="${i === 0 ? '#b13e53' : '#ffcd75'}"/><rect y="1" width="4" height="2" fill="${i === 0 ? '#b13e53' : '#ffcd75'}"/></svg>`
    : g.type === 'tateti' ? tttMark(i) : '');
  let board = '';
  if (g.type === 'tateti') {
    board = `<div class="ttt">${g.board.map((v, i) => `<button data-cell="${i}" class="${g.line && g.line.includes(i) ? 'win' : ''}"
      ${!myTurn || v !== null ? 'disabled' : ''} aria-label="Casilla ${i + 1}${v === null ? '' : v === 0 ? ', cruz' : ', círculo'}">${v === null ? '' : tttMark(v)}</button>`).join('')}</div>`;
  } else if (g.type === 'cuatro') {
    board = `<div class="c4">${g.board.map((v, i) => `<button data-col="${i % 7}" class="${v === null ? '' : 'd' + v}${g.last === i ? ' last' : ''}${g.line && g.line.includes(i) ? ' win' : ''}"
      ${!myTurn ? 'disabled' : ''} aria-label="Columna ${(i % 7) + 1}"></button>`).join('')}</div>`;
  } else {
    const pad = reflejosPad(g);
    board = `<div class="score">${g.score[meIdx]} - ${g.score[1 - meIdx]}</div>
      <button class="pad ${pad.cls}" id="pad">${esc(pad.big)}<small>${esc(pad.small)}</small></button>`;
  }
  const rival = g.players[1 - meIdx];
  const needsMe = meInfo && meInfo.claude && meInfo.claude.state === 'waiting';
  $('#gameBox').innerHTML = `
    <h2 id="gameTitle">${esc(GAME_LABEL[g.type])}</h2>
    ${needsMe ? '<div class="game-alert" role="alert">Tu Claude te necesita en la terminal</div>' : ''}
    <div class="vs"><span>${chipFor(meIdx)} Vos</span><span>${esc(rival)} ${chipFor(1 - meIdx)}</span></div>
    <div class="gstatus">${esc(gameStatusText(g))}</div>
    ${board}
    <div class="gfoot">${g.status === 'playing'
      ? '<button class="btn soft" id="gLeave">Abandonar</button>'
      : '<button class="btn soft" id="gClose">Cerrar</button><button class="btn" id="gAgain">Revancha</button>'}</div>`;
  const box = $('#gameBox');
  box.querySelectorAll('[data-cell]').forEach((b) => b.addEventListener('click', () => send({ type: 'game', id: g.id, action: 'move', cell: Number(b.dataset.cell) })));
  box.querySelectorAll('[data-col]').forEach((b) => b.addEventListener('click', () => send({ type: 'game', id: g.id, action: 'move', col: Number(b.dataset.col) })));
  const pad = $('#pad');
  if (pad) pad.addEventListener('pointerdown', (e) => { e.preventDefault(); hitPad(); });
  const leave = $('#gLeave');
  if (leave) leave.addEventListener('click', () => { if (confirm('¿Abandonar la partida? Tu rival gana.')) send({ type: 'game', id: g.id, action: 'leave' }); });
  const close = $('#gClose');
  if (close) close.addEventListener('click', () => { dlg.close(); game = null; });
  const again = $('#gAgain');
  if (again) again.addEventListener('click', () => { send({ type: 'invite', to: rival, game: g.type }); dlg.close(); game = null; });
}
function hitPad() {
  const g = game;
  if (!g || g.type !== 'reflejos' || g.status !== 'playing') return;
  const meIdx = g.players.indexOf(me);
  if (g.hits[meIdx]) return;
  if (g.phase === 'wait') send({ type: 'game', id: g.id, action: 'hit', early: true });
  else if (g.phase === 'go' && goSeen.round === g.round) send({ type: 'game', id: g.id, action: 'hit', ms: Math.round(performance.now() - goSeen.at) });
}
document.addEventListener('keydown', (e) => {
  if (dlg.open && game && game.type === 'reflejos' && (e.code === 'Space' || e.code === 'Enter')) { e.preventDefault(); hitPad(); }
});

// ================= burbujas y avisos =================
function bubble(name, text, emote) {
  const sp = sprites.get(name);
  if (!sp) return;
  sp.el.querySelectorAll('.bubble').forEach((b) => b.remove());
  const b = document.createElement('div');
  b.className = 'bubble' + (emote ? ' emote' : '');
  b.textContent = text;
  sp.el.appendChild(b);
  setTimeout(() => b.remove(), emote ? 2500 : 6000);
}
function burst(name, icon) {
  const host = (sprites.get(name) || {}).el || robots.get(name);
  if (!host || host.hidden) return;
  const b = document.createElement('div');
  b.className = 'burst';
  b.innerHTML = ICON[icon] || '';
  host.appendChild(b);
  setTimeout(() => b.remove(), 1700);
}
function toast(text) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = text;
  $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), 4500);
}

// ================= botones de arriba =================
function paintHeader() {
  const s = $('#sndBtn');
  s.innerHTML = `${Sound.on ? SPK_ON : SPK_OFF}<span>Sonido</span>`;
  s.setAttribute('aria-pressed', String(Sound.on));
  const n = $('#notifyBtn');
  n.innerHTML = `${Notify.on ? BELL_ON : BELL_OFF}<span>Avisos</span>`;
  n.setAttribute('aria-pressed', String(Notify.on));
  const wide = document.body.classList.contains('wide-room');
  const w = $('#wideBtn');
  w.innerHTML = `${wide ? SHRINK : EXPAND}<span>${wide ? 'Ver paneles' : 'Ampliar sala'}</span>`;
  w.setAttribute('aria-pressed', String(wide));
}
const TERM = UI(['KKKKKKKKK', 'K.......K', 'K.K.....K', 'K..K....K', 'K.K..KK.K', 'K.......K', 'KKKKKKKKK']);
$('#miniBtn').innerHTML = `${TERM}<span>Mini</span>`;
$('#miniBtn').addEventListener('click', () => {
  try { navigator.clipboard.writeText('/sala-mini'); } catch { /* sin portapapeles */ }
  toast('Mini sala: en Claude Code escribí /sala-mini (ya lo copié). Se abre una franja debajo de Claude con todos caminando. Con la tecla s volvés acá.');
});
$('#sndBtn').addEventListener('click', () => { Sound.toggle(); paintHeader(); });
$('#notifyBtn').addEventListener('click', async () => { await Notify.toggle(); paintHeader(); });
$('#wideBtn').addEventListener('click', () => {
  document.body.classList.toggle('wide-room');
  store.set('sala_wide', document.body.classList.contains('wide-room') ? '1' : '0');
  paintHeader();
});
if (store.get('sala_wide') === '1') document.body.classList.add('wide-room');
paintHeader();

// ================= red =================
let ws = null;
let lastWaiting = false;
function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }
function setConn(on, text) { $('#conn').classList.toggle('on', on); $('#conn span').textContent = text; }
function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws${token ? '?t=' + encodeURIComponent(token) : ''}`);
  ws.onopen = () => setConn(true, 'Conectado');
  ws.onclose = () => { setConn(false, 'Sin conexión, reintentando…'); setTimeout(connect, 2500); };
  ws.onmessage = (e) => {
    let m;
    try { m = JSON.parse(e.data); } catch { return; }
    switch (m.type) {
      case 'hello': catalog = m.catalog; break;
      case 'me': {
        const changedMe = m.name !== me;
        me = m.name; meHidden = !!m.hidden; myAvatar = m.avatar || null; meInfo = m;
        if (m.serverTime) clockOffset = m.serverTime - Date.now();
        if (!m.name && token) {
          toast('Tu link de la sala ya no es válido. Pedile uno nuevo a quien la administra.');
          store.set('sala_token', ''); token = null;
        }
        if (changedMe) { buildEquipo(); buildMePanel(); setTabsForUser(); } else syncEditor();
        renderPetPanel(changedMe);
        renderGamesPanel();
        renderMine();
        renderDesks();
        const waiting = !!(m.claude && m.claude.state === 'waiting');
        if (waiting !== lastWaiting) { lastWaiting = waiting; if (dlg.open) renderGame(); }
        if (me) setConn(true, `Conectado como ${me}`);
        break;
      }
      case 'state': room = m; render(); break;
      case 'chat_log': chatItems = m.items || []; renderChatLog(); break;
      case 'chat':
        bubble(m.name, m.text, m.emote);
        if (!m.emote) {
          chatItems.push({ name: m.name, text: m.text, t: m.t || Date.now() });
          if (chatItems.length > 40) chatItems.shift();
          renderChatLog();
          if (m.name !== me) { badge('equipo'); attend(`${m.name} escribió`); }
        }
        Sound.play(m.name === me ? 'blip' : 'chat');
        break;
      case 'bonus': toast(`+${m.coins} monedas por pasar por la sala hoy`); break;
      case 'claude_needs_you': ping('Tu Claude te necesita', 'Está esperando tu aprobación en la terminal.', 'alert'); renderMine(); break;
      case 'claude_done': doneUntil = Date.now() + 20000; ping('Tu Claude terminó', 'Volvé a la terminal cuando quieras.', 'done'); renderMine(); break;
      case 'done': burst(m.name, 'star'); break;
      case 'error': toast(m.text); Sound.play('error'); break;
      case 'pet_event': animatePet(m.name, m.anim || 'love', m.emoji); Sound.play(m.anim === 'eat' ? 'eat' : m.anim === 'play' ? 'ball' : 'love'); break;
      case 'avatar_ai': burst(m.name, 'star'); Sound.play('magic'); if (m.name !== me) toast(`${m.name} estrenó personaje`); break;
      case 'invited': showInvite(m); badge('juegos'); ping(`${m.from} te desafía`, `a ${GAME_LABEL[m.game] || m.game}. Tenés ${Math.round((m.expiresIn || 60000) / 1000)} segundos para aceptar.`, 'invite'); break;
      case 'invite_gone': removeInvite(m.id); break;
      case 'invite_sent': toast(`Le mandaste el desafío a ${m.to}. Esperando respuesta…`); break;
      case 'invite_declined': toast(`${m.by} dijo que ahora no`); break;
      case 'invite_expired': toast(`${m.to} no respondió el desafío`); break;
      case 'game': onGame(m.game); break;
      case 'game_over': onGameOver(m); break;
      default: break;
    }
  };
}

roomEl.addEventListener('click', (e) => {
  const mine = myUser();
  if (!mine || !mine.web || mine.playing) return;
  const r = roomEl.getBoundingClientRect();
  const x = ((e.clientX - r.left) / r.width) * 1000, y = ((e.clientY - r.top) / r.height) * 620;
  const mk = document.createElement('div');
  mk.className = 'marker';
  mk.innerHTML = ICON.marker;
  mk.style.left = x / 10 + 'cqw';
  mk.style.top = y / 10 + 'cqw';
  layer.appendChild(mk);
  setTimeout(() => mk.remove(), 650);
  send({ type: 'move', x, y });
});

buildEquipo();
selectTab(activeTab);
connect();

</script>
